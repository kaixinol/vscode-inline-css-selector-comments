# Publishes to the VS Code Marketplace with Microsoft Entra ID, since Azure
# DevOps global PATs retire on 2026-12-01. Requires a federated managed identity
# (see the marketplace.visualstudio.com publisher settings), the AZURE_CLIENT_ID
# and AZURE_TENANT_ID repository secrets, and the AZURE_CLIENT_ID identity added
# as a Contributor on the publisher.

name: Publish

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: Package only, do not publish
        type: boolean
        default: true

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: marketplace-publish

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag $TAG_VERSION does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          npm install -g @vscode/vsce
          npm ci || npm install

      - name: Package
        run: vsce package --no-git-tag-version --skip-license

      - name: Publish
        if: ${{ !inputs.dry-run }}
        run: vsce publish --no-git-tag-version --skip-license --azure-credential
